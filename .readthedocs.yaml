# Read the Docs build configuration, the counterpart of .github/workflows/generate_docs.yml.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    pre_install:
      - pip install --upgrade pip
      # autodoc imports gato, so the build needs torch; the CPU-only index avoids the
      # multi-GB CUDA wheels that the default PyPI build pulls in.
      - pip install torch --index-url https://download.pytorch.org/whl/cpu

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
