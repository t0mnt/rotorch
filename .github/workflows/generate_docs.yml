name: docs
on: [push, pull_request]

permissions:
  contents: read

# A queued deploy waits for the running one rather than cancelling it, so main is never
# left half published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build and generate docs
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Build docs
      # autodoc imports gato, so the docs build needs the package and its dependencies;
      # the CPU-only index avoids the multi-GB CUDA torch wheels.
      run: |
        pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install --upgrade ".[docs]"
        mkdir docs_build
        sphinx-build -nW -b html docs docs_build
    - name: Upload the pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs_build

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: build-docs
    # Pull requests are built but not published, and neither is any branch but main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v4
