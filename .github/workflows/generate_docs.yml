name: docs
on: [push, pull_request]


jobs:
  build-docs:
    name: Build and generate docs
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Build docs
      # autodoc imports gato, so the docs build needs the package and its dependencies;
      # the CPU-only index avoids the multi-GB CUDA torch wheels.
      run: |
        pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install --upgrade ".[docs]"
        mkdir docs_build
        sphinx-build -nW -b html docs docs_build
